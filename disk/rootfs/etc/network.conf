# AIOS network configuration
# STATIC FALLBACK -- used only when boot-time DHCP fails (8 attempts).
# Set for the real LAN: a stall quantum eating the DHCP window used to
# leave the Pi at the old QEMU-era 10.0.2.15 = unreachable. On QEMU,
# SLIRP DHCP always binds, so this fallback never applies there.
ip=192.168.0.250
gateway=192.168.0.1
mask=255.255.255.0
